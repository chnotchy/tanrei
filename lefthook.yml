# Fast local guards. CI runs the same checks plus the platform test suites.
pre-commit:
  parallel: true
  commands:
    secrets:
      run: gitleaks protect --staged --redact --no-banner
      skip:
        - run: "! command -v gitleaks >/dev/null"
    validate:
      glob: "{tokens,specs}/**"
      # The tools checks read what is being committed (TANREI_CHECK_STAGED), like parity.
      run: node packages/tokens-build/src/cli.js validate && TANREI_CHECK_STAGED=1 node packages/tools/src/cli.js validate
    parity:
      # What is being committed, not the working tree (TANREI_CHECK_STAGED reads the git index).
      run: TANREI_CHECK_STAGED=1 node packages/tools/src/cli.js parity
commit-msg:
  commands:
    conventional:
      run: 'grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9,/-]+\))?!?: .+" {1} || (echo "✖ use Conventional Commits, e.g. feat(web): add tanrei-checkbox" >&2; exit 1)'
pre-push:
  commands:
    drift:
      run: node packages/tools/src/cli.js drift
