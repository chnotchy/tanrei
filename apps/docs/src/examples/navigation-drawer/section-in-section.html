<!-- reports: NVD-17 -->
<tanrei-navigation-drawer open value="inbox" label="{{words.mail}}" style="block-size: 18rem; inline-size: 15rem">
  <tanrei-navigation-drawer-section headline="{{words.mail}}">
    <tanrei-navigation-drawer-item value="inbox" label="{{words.inbox}}" icon="inbox"></tanrei-navigation-drawer-item>
    <tanrei-navigation-drawer-item value="sent" label="{{words.sent}}" icon="send"></tanrei-navigation-drawer-item>
    <tanrei-navigation-drawer-section headline="{{words.labels}}" divider>
      <tanrei-navigation-drawer-item value="work" label="{{words.work}}" icon="label"></tanrei-navigation-drawer-item>
      <tanrei-navigation-drawer-item value="family" label="{{words.family}}" icon="label"></tanrei-navigation-drawer-item>
    </tanrei-navigation-drawer-section>
  </tanrei-navigation-drawer-section>
</tanrei-navigation-drawer>
