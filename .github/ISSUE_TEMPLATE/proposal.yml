name: Spec or token proposal
description: Propose a new component, a change to a component's surface, or a token change
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem does this solve for people using products built with Tanrei? }
    validations: { required: true }
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: Props, states, behavior (EARS), accessibility, tokens. How does each of the five platforms express it idiomatically?
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
